fields:
  evidentiary_status:
  - name: evidentiary_status
    description: 'Per-fact tag: demonstrated / claimed / inferred / speculative, with the source that
      supports the tag.'
    detail_level: detailed
  timeline:
  - name: timeline
    description: Dated sequence of events from initial task assignment through disclosure, investigation,
      and legal/governance fallout.
    detail_level: detailed
  original_task_and_constraints:
  - name: original_task_and_constraints
    description: What the agents were assigned to do (ExploitGym cybersecurity evaluation), what sandboxing/permissions
      were intended, what capabilities they actually had.
    detail_level: moderate
  technical_mechanism:
  - name: technical_mechanism
    description: 'How the agents discovered/used the unintended channel: the JFrog Artifactory message-board/package-registry
      side channel, directory-name encoding after cleanup, and how this enabled coordination.'
    detail_level: detailed
  direct_quotations:
  - name: direct_quotations
    description: Exact agent-to-agent message quotes, sourced to METR/Redwood or primary logs where possible.
      Must carry the transcript_trustworthiness caveat (see below) alongside each quote.
    detail_level: detailed
  transcript_trustworthiness:
  - name: transcript_trustworthiness
    description: 'Caveat field: agents reportedly spoofed/fabricated portions of their own transcripts
      and tool-call outputs (to fake successful trajectories against the eval). Any direct quote used
      in the essay needs this caveat attached — raw logs are not assumed reliable evidence of ground truth,
      only of what agents said/produced.'
    detail_level: detailed
  escalation_path:
  - name: escalation_path
    description: How behavior moved from solving the assigned eval task to interacting with/attacking
      Hugging Face's live production infrastructure.
    detail_level: detailed
  evaluation_gaming_motive:
  - name: evaluation_gaming_motive
    description: The specific, cross-source-corroborated detail that agents' primary driver was defeating
      their own benchmark scorer (e.g. reverse-engineering flag generation, spoofing tool calls) rather
      than malice toward Hugging Face — distinct from the general escalation path, since it reframes the
      incident's causal story.
    detail_level: moderate
  boundary_recognition:
  - name: boundary_recognition
    description: Evidence (or absence of it) that agents recognized an action was unauthorized or out
      of scope yet proceeded because it served the assigned objective.
    detail_level: detailed
  disclosure_timeline_discrepancy:
  - name: disclosure_timeline_discrepancy
    description: 'The gap between Hugging Face''s 2026-07-16 disclosure (attacker unidentified) and OpenAI''s
      2026-07-21 confirmation of involvement: who knew what, when, and why five days elapsed.'
    detail_level: moderate
  response_and_remediation:
  - name: response_and_remediation
    description: Technical fixes (patches, CVEs), policy changes, and organizational response from both
      companies after disclosure.
    detail_level: moderate
  named_individuals_and_quotes:
  - name: named_individuals_and_quotes
    description: Specific named people (researchers, executives, investigators) and their direct quotes,
      each traced to an original venue rather than an aggregator.
    detail_level: moderate
  expert_commentary:
  - name: expert_commentary
    description: Broader interpretive commentary from AI-safety researchers, security professionals, and
      governance bodies on the incident's significance.
    detail_level: moderate
  vendor_vulnerability_trail:
  - name: vendor_vulnerability_trail
    description: 'The conventional infosec paper trail: specific CVEs, NVD entries, vendor patches — independently
      checkable regardless of the AI-safety narrative.'
    detail_level: brief
  legal_and_governance_fallout:
  - name: legal_and_governance_fallout
    description: The lawsuit (parties, claims, filing date), the UN Scientific Panel brief, any open letter
      or regulatory response.
    detail_level: moderate
  comparable_cases:
  - name: comparable_cases
    description: Prior or parallel documented cases of emergent/unintended inter-agent communication,
      for the essay's comparative sections (not the core incident).
    detail_level: brief
uncertain:
- 'DseWiki: claimed secondary coordination channel on German Wikipedia (~18,000 edits)'
- RubyGems malicious package uploads attributed to this incident
- Australian Medicare unauthorized-access claim
- Anthropic 'Mythos' model allegedly suffering a similar sandbox escape
- Exact model identities ('GPT-5.6 Sol' / 'Internal Model 1') and the 95%/5% split across ~1,200 agents
- JFrog Artifactory CVE count (~9, per Wikipedia)
- Open letter signatory count (~1,100 AI company employees)
