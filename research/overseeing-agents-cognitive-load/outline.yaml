topic: "Overseeing agents is the tiring part: the cognitive cost of supervising AI coding agents, and what a leader should do about it"

angle: >
  A leadership essay built on the 2026-10-18 idea in article_ideas.md. Generation is cheap;
  the cost has moved to oversight (monitoring, reviewing, deciding), and that cost lands on
  people. Start from the BCG/HBR "AI brain fry" study (1,488 US workers, HBR 5 March 2026),
  then ask whether older human-factors research on monitoring automation predicts it, what
  the software-specific evidence shows, and what limits and metrics a leader can set. It
  extends "What It Takes to Trust Agent Output" (which says review must be staffed to volume
  but not what review does to the reviewer) and must not restate it, "The Verification Gap"
  or "Checking Isn't Catching".

caveats_to_test:
  - "BCG/HBR figures are self-reported and correlational, from a consultancy that sells AI transformation. Keep that visible."
  - "The 'productivity dips after three tools' finding is about perceived productivity across tools, not coding agents; HBR's leader advice turns it into 'three AI agents'."
  - "Intent to quit 25% to 34% is called a '39% increase' in the article; on those figures it is 36%."
  - "Press and blog coverage misreports the 33% decision fatigue and 11%/39% error figures. Use only what the HBR article says."
  - "Separate observed behaviour from self-report, and software engineers from other roles."
  - "Open every primary source; mark access_status honestly."

items:
  - name: "BCG and HBR study: When Using AI Leads to Brain Fry (March 2026)"
    note: "Bedard, Kropp, Hsu, Karaman, Hawes, Kellerman. HBR 5 March 2026. Already read from a printed copy (the live page is paywalled) and BCG's summary page. Re-open BCG page and try the HBR page and any BCG Henderson Institute detail; record exact wording, sample, measures, limits."
  - name: "HBR: AI Doesn't Reduce Work, It Intensifies It (February 2026)"
    note: "Ranganathan and Ye (Berkeley Haas). 200 employees at a US tech company over eight months. Open the HBR article or the authors' paper. What they observed versus self-reported; workload creep; proposed norms."
  - name: "Bainbridge, Ironies of Automation (1983)"
    note: "Classic paper: the operator left to monitor automation is given the hardest job when it fails and has the least practice. Open the paper or a reliable reproduction; quote carefully."
  - name: "Vigilance and mental workload in monitoring tasks"
    note: "Warm, Parasuraman and Matthews 2008 (Human Factors), 'Vigilance requires hard mental work and is stressful', and Wohleber et al. on automation and vigilance. Open the papers or abstracts; say which."
  - name: "Monitoring partially automated vehicles: driver overload"
    note: "The 2019 simulator study and the 2023 Human Factors study (45-minute drive, secondary task) from the search. Open them. Only useful as an analogy for supervising an automated agent; say so."
  - name: "Task switching and attention residue"
    note: "Leroy 2009 on attention residue and one study of the cost of switching between applications. Open the papers. Relevance to juggling several agent sessions."
  - name: "3,100 Opinions on Code Review in an AI World (arXiv 2607.07980)"
    note: "Agarwal et al., July 2026. Open it. What it says about agent-authored PR review, reviewer load, and how robust its trends are."
  - name: "Practitioner study of agent-assisted development bottlenecks (July 2026 preprint)"
    note: "20 interviews and an 80-person survey; bottlenecks shift to non-coding work and reviewing agent output becomes central. Find the arXiv paper and open it."
  - name: "Developer accounts of agent fatigue: Steve Yegge's Gas Town and Francesco Bonacci's Vibe Coding Paralysis"
    note: "Primary posts quoted by HBR. Open them. These are anecdotes; use only as quoted evidence of how it feels, not as data."
  - name: "Temporal State of Development 2026: agents per person and issues hit"
    note: "Reuse research/trust-ai-agent-output/ for verified facts (median 5 agents, mean 10.7; agents run and issue frequency 'not correlated'). Re-open the page to quote."
  - name: "Meta and token or AI-line metrics as performance measures"
    note: "HBR says Meta includes lines of code generated by AI as a performance metric for engineers. Find a primary or well-sourced report and open it; drop if it cannot be verified."
  - name: "Span of control and limits on human-plus-agent oversight"
    note: "Whether any research or organisational guidance sets a limit on agents per person, or on direct reports per manager, that could anchor a leader's rule. Open sources. Drop if only opinion."

execution:
  batch_size: 5
  items_per_agent: 1
  output_dir: ./results
